# ╔══════════════════════════════════════════════════════════════╗
# ║  Override: deploy ConversaFlow                             ║
# ║                                                            ║
# ║  - Usa imagem pre-built do GHCR (fix @lid)                ║
# ║  - Remove dokploy-network (nao existe no nosso deploy)     ║
# ║  - Usa .env gerado a partir do conversaflow-api/.env.prod  ║
# ║                                                            ║
# ║  Uso:                                                      ║
# ║    docker compose up -d                                    ║
# ╚══════════════════════════════════════════════════════════════╝

services:
  api:
    image: ghcr.io/anderson-santiago/evolution-api:latest
    networks:
      - evolution-net
    # Remove dokploy-network do servico api

  redis:
    networks:
      evolution-net:
        aliases:
          - evolution-redis
    # Remove dokploy-network do servico redis

  evolution-postgres:
    networks:
      - evolution-net
    # Remove dokploy-network do servico postgres

networks:
  dokploy-network:
    driver: bridge
    # Redefine como local em vez de external para evitar erro
